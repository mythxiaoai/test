<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React 18 - 不使用 startTransition</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .list-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .slow-flag {
            color: red;
            font-size: 14px;
            margin-left: 10px;
        }
        .fps-counter {
            position: fixed;
            top: 10px;
            right: 10px;
            background: black;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .description {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="fps-counter" id="fps-counter">FPS: 0</div>
    <h1 class="header">React 18 - 不使用 startTransition</h1>
    
    <div class="container">
        <div class="description">
            <p>这个示例<strong>不使用</strong> startTransition API。当您在搜索框中输入文字时，应用会立即响应并尝试渲染所有结果，
            可能会导致界面卡顿，尤其是在生成大量列表项时。</p>
            <p>尝试快速输入文字，观察输入响应性和FPS计数器的变化。</p>
        </div>
        
        <div id="app"></div>
    </div>

    <!-- 加载React, React DOM以及Babel通过CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        // 创建一个带有FPS计数器的组件
        function FPSCounter() {
            const [fps, setFPS] = React.useState(0);
            
            React.useEffect(() => {
                let frameCount = 0;
                let lastTime = performance.now();
                
                const countFrames = (time) => {
                    frameCount++;
                    
                    if (time - lastTime > 1000) {
                        setFPS(Math.round(frameCount * 1000 / (time - lastTime)));
                        frameCount = 0;
                        lastTime = time;
                    }
                    
                    requestAnimationFrame(countFrames);
                };
                
                const frameId = requestAnimationFrame(countFrames);
                return () => cancelAnimationFrame(frameId);
            }, []);
            
            React.useEffect(() => {
                document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
            }, [fps]);
            
            return null;
        }

        // 创建一个耗时的组件来模拟复杂的渲染过程
        function SlowListItem({ text, index }) {
            const now = performance.now();
            while (performance.now() - now < 0.1) {
                // 人为添加一些延迟，模拟复杂计算
            }
            
            const isSlowToRender = index % 10 === 0;
            
            return (
                <div className="list-item">
                    {text} - 项目 #{index + 1}
                    {isSlowToRender && <span className="slow-flag">（耗时渲染）</span>}
                </div>
            );
        }

        // 主应用组件
        function App() {
            const [searchTerm, setSearchTerm] = React.useState('');
            const [items, setItems] = React.useState([]);
            
            // 当搜索词变化时，立即更新搜索结果
            React.useEffect(() => {
                const newItems = [];
                // 根据搜索词生成列表项
                if (searchTerm) {
                    for (let i = 0; i <2000; i++) {
                        if (i.toString().includes(searchTerm) || 
                            `项目 ${i}`.includes(searchTerm)) {
                            newItems.push(`匹配 "${searchTerm}"`);
                        }
                    }
                }
                setItems(newItems);
            }, [searchTerm]);
            
            return (
                <div>
                    <FPSCounter />
                    
                    <h2>搜索示例</h2>
                    <input
                        type="text"
                        placeholder="输入数字进行搜索（例如: 1, 2, 3...）"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                    />
                    
                    <div>
                        <h3>搜索结果: {items.length} 个项目</h3>
                        {items.map((item, index) => (
                            <SlowListItem key={index} text={item} index={index} />
                        ))}
                    </div>
                </div>
            );
        }

        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>

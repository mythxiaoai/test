<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">-</div>
  <script src="https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.0.0-beta.3/babel.js"></script>
  <script
    src="https://cdn.bootcdn.net/ajax/libs/react/18.0.0-rc.1-next-cb1e7b1c6-20220303/umd/react.development.js"></script>
  <script
    src="https://cdn.bootcdn.net/ajax/libs/react-dom/18.0.0-rc.1-next-cb1e7b1c6-20220303/umd/react-dom.development.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/mobx/6.4.2/mobx.umd.development.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/mobx-react/7.3.0/mobxreact.umd.development.js"></script>
  <script type="text/babel">
    let { Component, memo } = React;
    let { observer } = mobxReact;
    let { observable, computed, makeAutoObservable, autorun, action } = mobx;
    function TextMemo(props) {
      console.log('子组件渲染')
      if (props)
        return <div>hello,world</div>
    }

    const controlIsRender = (pre, next) => {
      if (pre.number === next.number) { // number 不改变 ，不渲染组件
        return true
      } else if (pre.number !== next.number && next.number > 5) { // number 改变 ，但值大于5 ， 不渲染组件
        return true
      } else { // 否则渲染组件
        return false
      }
    }

    const NewTexMemo = memo(TextMemo, controlIsRender)
    class Index extends React.Component {
      constructor(props) {
        super(props)
        this.state = {
          number: 1,
          num: 1
        }
      }
      render() {
        const { num, number } = this.state
        return <div>
          <div>
            改变num：当前值 {num}
            <button onClick={() => this.setState({ num: num + 1 })} >num++</button>
            <button onClick={() => this.setState({ num: num - 1 })} >num--</button>
          </div>
          <div>
            改变number： 当前值 {number}
            <button onClick={() => this.setState({ number: number + 1 })} > number ++</button>
            <button onClick={() => this.setState({ number: number - 1 })} > number -- </button>
          </div>
          <NewTexMemo num={num} number={number} />
        </div>
      }
    }


    ReactDOM.render(<Index></Index>, document.getElementById('app'));

  </script>
</body>

</html>

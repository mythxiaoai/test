<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="mount">1</div>
  <button id="button">Increment</button>
  <script src="https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.0.0-beta.3/babel.js"></script>
  <script
    src="https://cdn.bootcdn.net/ajax/libs/react/18.0.0-rc.1-next-cb1e7b1c6-20220303/umd/react.development.js"></script>
  <script
    src="https://cdn.bootcdn.net/ajax/libs/react-dom/18.0.0-rc.1-next-cb1e7b1c6-20220303/umd/react-dom.development.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/mobx/6.4.2/mobx.umd.development.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/mobx-react/7.3.0/mobxreact.umd.development.js"></script>
  <script type="text/babel">
    let { Component } = React;
    let { observer } = mobxReact;
    let { observable, computed, makeAutoObservable, autorun, action } = mobx;
    let i = 0;
    class TodoList {
      todos = []
      constructor() {
        makeAutoObservable(this)
      }
      get unfinishedTodoCount() {
        return this.todos.filter(todo => !todo.finished).length;
      }
      push() {
        this.todos.push({ id: ++i, finished: false });
      }
    }





    let TodoListView = observer(({ todoList }) => (
      <div>
        <ul>
          {todoList.todos.map(todo =>
            <TodoView todo={todo} key={todo.id} />
          )}
        </ul>
        Tasks left: {this.props.todoList.unfinishedTodoCount}
      </div>
    ))



    const TodoView = observer(({ todo }) =>
      <li>
        <input
          type="checkbox"
          checked={todo.finished}
          onClick={() => todo.finished = !todo.finished}
        />{todo.title}
      </li>
    )

    const store = new TodoList();

    setInterval(() => {
      store.push()
    }, 1000)
    ReactDOM.render(<TodoListView todoList={store}></TodoListView>, document.getElementById('mount'));

    console.log(2)
  </script>
</body>

</html>
